    notes: "English-speaking Finland aggregator in the same portal family as englishjobsearch.ch, with the same llms.txt search contract, markdown rendering, and `page` pagination. Use as a seeded discovery source; outbound links remain portal clickouts."
    enabled: false

  - name: English Jobs Netherlands
    careers_url: https://englishjobsearch.nl
    api_provider: englishjobs
    api_params:
      q:
        - "platform engineer"
        - "backend engineer"
        - "software engineer"
      location:
        - amsterdam
        - utrecht
      include:
        - dutch
    api_max_pages: 3
    notes: "English-speaking Netherlands aggregator in the same portal family as englishjobsearch.ch, with the same llms.txt search contract, markdown rendering, and `page` pagination. Use as a seeded discovery source; outbound links remain portal clickouts."
    enabled: false

  - name: English Jobs Germany
    careers_url: https://englishjobs.de
    api_provider: englishjobs
    api_params:
      q:
        - "platform engineer"
        - "backend engineer"
        - "software engineer"
      location:
        - berlin
        - muenchen
      include:
        - german
    api_max_pages: 3
    notes: "English-speaking Germany aggregator in the same portal family as englishjobsearch.ch, with the same llms.txt search contract, markdown rendering, and `page` pagination. Use as a seeded discovery source; outbound links remain portal clickouts."
    enabled: false

  - name: Working Nomads Europe
    careers_url: https://www.workingnomads.com/remote-europe-jobs
    api_provider: workingnomads
    api: https://www.workingnomads.com/api/exposed_jobs/
    api_params:
      location:
        - Europe
      published_within_days: 30
    notes: "Public JSON API with canonical Working Nomads job URLs, title, company, location, category, tags, description, and publish date. No reliable server-side region/category/paging params were observed, so the optimal integration is one API fetch plus local filtering."
    enabled: false

  - name: NoDesk
    careers_url: https://nodesk.co/remote-jobs/
    api_provider: nodesk
    api_params:
      search_filter:
        - remote-jobs/engineering
        - remote-jobs/product
    api_max_pages: 3
    notes: "Public Algolia search index behind NoDesk's SSR listings, referer-gated but stable. Best integration is structured search hits plus detail-page enrichment to recover the real outbound apply URL, salary text, and JobPosting dates."
    enabled: false

  - name: Dice
    careers_url: https://www.dice.com/jobs
    api_provider: dice
    api: https://www.dice.com/jobs
    api_params:
      q:
        - 'artificial intelligence'
        - 'machine learning'
        - 'solutions architect'
        - 'platform engineer'
      includeRemote: true
      # Optional public filters seen in Dice search state:
      # filters.workplaceTypes:
      #   - Remote
      #   - Hybrid
      # employmentType:
      #   - FULLTIME
      #   - CONTRACTS
      # postedDate:
      #   - ONE
      #   - THREE
      #   - SEVEN
      # employerType:
      #   - Direct Hire
      #   - Recruiter
    api_page_size: 20
    api_max_pages: 4
    notes: "SSR search pages embed structured job results with canonical job-detail URLs, company, title, location, employment type, salary, workplace type, easy-apply flag, and pageCount. Best used with a small set of seeded queries rather than broad unfiltered crawling."
    enabled: false

