    api_max_pages: 3
    notes: "English-speaking Norway aggregator in the same portal family as englishjobsearch.ch, with the same llms.txt search contract, markdown rendering, and `page` pagination. Use as a seeded discovery source; outbound links remain portal clickouts."
    enabled: false

  - name: English Jobs Finland
    careers_url: https://englishjobs.fi
