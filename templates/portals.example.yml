# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (4 levels):
#   0. Local parser → per-company `parser:` script for SSR/static career pages (zero-token)
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. HTTP JSON (WebFetch) → per-company `api:` on tracked_companies (see board_api_catalog below)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.mastercard.com   ⚠️ https://mastercard.wd1.myworkdayjobs.com (fallback only)
#   ✅ https://openai.com/careers       ⚠️ https://job-boards.greenhouse.io/openai (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Scan history recheck policy (optional) --
# By default, URLs recorded in data/scan-history.tsv are deduped forever.
# Set recheck_after_days to let previously added URLs become eligible again
# after N days, useful for roles that reopen or are republished at the same URL.
# Permanent invalid statuses such as blocked host or malformed URL still remain
# deduped forever.
#
# scan_history:
#   recheck_after_days: 30

# -- Location filter (optional) --
# Filter scanned jobs by location. Applied AFTER title filter, BEFORE dedup.
# If this entire block is absent, all locations pass (current default behavior).
#
# Semantics (case-insensitive substring, in this order):
#   - Empty location string on a job → pass (don't penalize missing data)
#   - Any `always_allow` keyword present → pass (takes precedence over `block`)
#   - Any `block` keyword present → reject
#   - `allow` empty → pass (already cleared block)
#   - `allow` non-empty → must match at least one keyword
#
# `always_allow` is optional. It rescues multi-location postings that name your
# home region: with always_allow ["New York"] and block ["India"], a job listed
# "Remote, New York or India" passes (New York wins), while "Remote, India" is
# still rejected. Omit always_allow entirely and the filter behaves as before.
#
# Example below targets US-based remote + a couple of US metros, blocking
# common foreign hubs. Customize to your geography.

# location_filter:
#   # always_allow is checked BEFORE block — keep this list to your home region only
#   always_allow:
#     - "United States"   # (replace with your home region)
#     - "New York"
#   allow:
#     - "Remote"
#     - "United States"
#     - "USA"
#     - "Atlanta"
#     - "New York"
#   block:
#     - "India"
#     - "Bengaluru"
#     - "United Kingdom"
#     - "London"
#     - "Germany"
#     - "France"
#     - "Singapore"
#     - "Japan"
#     - "Brazil"
#     - "Australia"

# -- Salary filter (optional) --
# Filter scanned jobs by annual compensation range. Applied AFTER location
# filter, BEFORE dedup. Only applies when structured salary data exists.
#
# Semantics:
#   - min/max are annual compensation filters (use annualized values)
#   - max: 0 means "no upper limit"
#   - If no salary data exists on a job, it passes (conservative behavior)
#   - If both currencies are known and differ, the job is rejected by the salary filter
#   - Partial ranges (min only or max only) work correctly
#   - If this entire block is absent, salary is not filtered (default behavior)
#
# Example: target roles paying at least $100k, no upper limit
# salary_filter:
#   min: 100000
#   max: 0
#   currency: "USD"

# -- Trust filter (optional) --
# Enriches each scanned job with a trust score (0-100) and flags.
# Jobs are NEVER dropped — only annotated. The trust score helps you
# prioritize which postings to evaluate first.
#
# Heuristics (V1):
#   1. URL structure validation (malformed or non-http URLs)
#   2. Missing application URL
#   3. Suspicious domain detection (link shorteners, form builders)
#   4. Company ↔ domain mismatch (with ATS allowlist)
#
# If this block is absent or enabled: false, all jobs get score 100.
#
# trust_filter:
#   enabled: true
#   suspicious_domains:
#     - "bit.ly"
#     - "tinyurl.com"
#     - "t.co"
#     - "forms.gle"
#     - "goo.gl"
#     - "shorturl.at"
#   # Override the built-in ATS allowlist (greenhouse, lever, workday, etc.).
#   # URLs hosted on these domains skip the company↔domain mismatch check.
#   # ats_allowlist:
#   #   - "greenhouse.io"
#   #   - "ashbyhq.com"
#   #   - "lever.co"
#   #   - "custom-ats.example.com"

# -- Content filter (optional) --
# Filters on the job DESCRIPTION text, not just the title — useful when
# companies post generic titles ("Software Engineer") with very different
# stacks. Case-insensitive substring match.
# Semantics:
#   - A job with no description always passes (see provider support below)
#   - Any `negative` keyword present → reject
#   - `positive` empty → pass (after clearing negatives)
#   - `positive` non-empty → at least one keyword must be present
#   - If this entire block is absent, descriptions are not filtered (default)
#
# Provider support: the scanner is zero-token and only reads descriptions that
# a provider already returns in its list payload — it never fetches each job
# page. Currently Lever (`descriptionPlain`) supplies descriptions; jobs from
# providers that don't always pass this filter (they're never silently dropped).
#
# Example: keep roles that mention Rust/Go, drop legacy PHP/WordPress shops
# content_filter:
#   positive:
#     - "rust"
#     - "golang"
#   negative:
#     - "php"
#     - "wordpress"

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target roles
    # -- Engineering roles --
    - "Platform Engineer"
    - "Web Platform Engineer"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Integration Engineer"
    - "Software Engineer"
    - "Software Developer"
    - "Software Architect"
    - "Backend"
    - "Backend Engineer"
    - "Backend Developer"
    - "Back-End"
    - "Back End"
    - "Full-Stack"
    - "Full Stack"
    - "Fullstack"
    - "Technical Lead"
    - "Tech Lead"
    - "Engineering Lead"
    - "Staff Engineer"
    - "Principal Engineer"
    # PT-PT specific localized keywords:
    - "Engenheiro de Software"
    - "Desenvolvedor de Software"
    - "Arquiteto de Software"
    - "Engenheiro de Plataforma"
    - "Engenheiro de Solucoes"
    - "Engenheiro de Soluções"
    - "Arquiteto de Solucoes"
    - "Arquiteto de Soluções"
    - "Engenheiro de Integracao"
    - "Engenheiro de Integração"
    - "Lider Tecnico"
    - "Líder Técnico"
    - "Lider de Engenharia"
    - "Líder de Engenharia"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    - "No-Code"
    - "Low-Code"
    - "Junior"
    - "Intern"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "Ruby"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Presales"
    - "Pre-Sales"
    - "Pre Sales"
    - "Account Executive"
    - "Sales Engineer"
    - "Solution Consultant"
    - "Customer Success"
    # PT-PT specific localized keywords:
    - "Júnior"
    - "Estagio"
    - "Estágio"
    - "Estagiario"
    - "Estagiário"
    - "Recem-Licenciado"
    - "Recém-Licenciado"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # Keep this list narrow and title-aligned with the current north star:
  # senior full-stack/backend/platform/lead roles, with solutions as an
  # adjacent lane rather than the main target.

  # -- ATS-heavy boards --
  - name: Ashby — Senior Full-Stack & Backend
    query: 'site:jobs.ashbyhq.com "Senior Full Stack Engineer" OR "Senior Full-Stack Engineer" OR "Senior Backend Engineer" OR "Staff Engineer" remote'
    enabled: true

  - name: Ashby — Platform & Lead
    query: 'site:jobs.ashbyhq.com "Platform Engineer" OR "Web Platform Engineer" OR "Technical Lead" OR "Engineering Lead" OR "Software Architect" remote'
    enabled: true

  - name: Greenhouse — Senior Full-Stack & Backend
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Senior Full Stack Engineer" OR "Senior Full-Stack Engineer" OR "Senior Backend Engineer" OR "Senior Software Engineer" remote'
    enabled: true

  - name: Greenhouse — Platform & Lead
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Platform Engineer" OR "Web Platform Engineer" OR "Technical Lead" OR "Engineering Lead" OR "Software Architect" remote'
    enabled: true

  - name: Greenhouse / Ashby — Solutions & Integration
    query: 'site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com "Solutions Engineer" OR "Solutions Architect" OR "Integration Engineer" remote'
    enabled: true

  - name: Workable — Backend / Full-Stack
    query: 'site:apply.workable.com "Senior Backend Engineer" OR "Senior Software Engineer" OR "Senior Full Stack Engineer" OR "Full-Stack Engineer" remote'
    enabled: true

  # -- Remote-friendly boards --
  - name: Remotive — Backend / Platform
    query: 'site:remotive.com "Senior Backend Engineer" OR "Senior Software Engineer" OR "Platform Engineer" OR "Technical Lead" Europe OR remote'
    enabled: true

  - name: WeWorkRemotely — Backend / Full-Stack
    query: 'site:weworkremotely.com "Senior Backend Engineer" OR "Senior Software Engineer" OR "Senior Full Stack Engineer" OR "Platform Engineer"'
    enabled: true

  - name: Working Nomads — Backend / Platform
    query: 'site:workingnomads.com "Senior Backend Engineer" OR "Senior Software Engineer" OR "Platform Engineer" OR "Engineering Lead"'
    enabled: true

  - name: EU Remote Jobs — Backend / Platform
    query: 'site:euremotejobs.com "Senior Backend Engineer" OR "Senior Software Engineer" OR "Platform Engineer" OR "Technical Lead" Europe'
    enabled: true

  - name: YC Jobs — Full-Stack / Backend
    query: 'site:workatastartup.com "Senior Backend Engineer" OR "Senior Full Stack Engineer" OR "Product Engineer" OR "Platform Engineer" remote'
    enabled: true

  - name: "HN Who's Hiring — Backend / Platform"
    query: 'site:news.ycombinator.com OR site:hnrss.org "Senior Backend Engineer" OR "Senior Software Engineer" OR "Full Stack Engineer" OR "Platform Engineer" remote'
    enabled: true

  # -- Iberia / Portugal --
  - name: Manfred — Senior Backend / Full-Stack
    query: 'site:getmanfred.com/en/job-offers "Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer" OR "Platform Engineer"'
    enabled: true

  - name: Tecnoempleo — Remoto Backend / Full-Stack
    query: 'site:tecnoempleo.com remoto OR remote "Senior Software Engineer" OR "Backend Engineer" OR "Full Stack Engineer" OR "Technical Lead"'
    enabled: true

  - name: JobFluent — Backend / Full-Stack
    query: 'site:jobfluent.com Madrid OR Barcelona OR Remote "Backend Engineer" OR "Full Stack Engineer" OR "Platform Engineer"'
    enabled: true

  # -- Portuguese market aggregators --
  # Indeed PT exposes useful search params (`q`, `l`, `start`, `fromage`,
  # `radius`, `jt`, `sc`) but aggressively blocks generic HTTP/headless access,
  # so it works best as a WebSearch discovery source rather than a zero-token
  # structured provider.

  - name: Indeed Portugal — Backend / Platform
    query: 'site:pt.indeed.com "Backend Engineer" OR "Software Engineer" OR "Full Stack Engineer" OR "Platform Engineer" OR "Engenheiro de Software" OR "Engenheiro de Plataforma" Portugal'
    enabled: true

  - name: Indeed Portugal — Lead / Solutions (PT)
    query: 'site:pt.indeed.com "Líder Técnico" OR "Lider Tecnico" OR "Líder de Engenharia" OR "Arquiteto de Soluções" OR "Engenheiro de Soluções" OR "Engenheiro de Integração" Portugal'
    enabled: true

  - name: IT Jobs Switzerland — Backend / Platform
    query: 'site:it-jobs-switzerland.ch "Backend Engineer" OR "Software Engineer" OR "Full Stack Engineer" OR "Platform Engineer" OR "Technical Lead" Switzerland OR Schweiz OR Zürich OR Lausanne OR Genève'
    enabled: true

  # -- Türkiye / Turkey job portals --
  # WebSearch queries for Turkish job boards (no public ATS APIs).
  # [CUSTOMIZE] Replace keywords with your target roles in Turkish.

  - name: Kariyer.net — Backend / Software Engineer
    query: 'site:kariyer.net "Backend Developer" OR "Software Engineer" OR "Yazılım Geliştirici" OR "Backend Geliştirici" Ankara OR Istanbul OR uzaktan'
    enabled: false

  - name: Kariyer.net — Frontend Engineer
    query: 'site:kariyer.net "Frontend Developer" OR "React Developer" OR "Frontend Geliştirici" Ankara OR Istanbul OR uzaktan'
    enabled: false

  - name: Yenibiris.com — Software Engineer
    query: 'site:yenibiris.com "Software Engineer" OR "Backend Developer" OR "Frontend Developer" OR "Yazılım Geliştirici"'
    enabled: false

  - name: Secretcv.com — Tech Roles
    query: 'site:secretcv.com "Software Engineer" OR "Backend" OR "Frontend" OR "Full Stack"'
    enabled: false

  - name: İşin Olsun — Startup / Tech
    query: 'site:isinolsun.com "Yazılım" OR "Software" OR "Backend" OR "Frontend" OR "Full Stack"'
    enabled: false

  - name: LinkedIn — Turkey Tech Roles
    query: 'site:linkedin.com/jobs "Software Engineer" OR "Backend Engineer" OR "Frontend Engineer" Turkey OR Türkiye OR Ankara OR Istanbul'
    enabled: false

# -- Tracked companies --
# Companies whose career pages are checked directly.
# scan_method: playwright (default), websearch, local_parser
# provider: greenhouse, pcsx, itjobs, sapo, portalemprego, landingjobs, swissdevjobs, germantechjobs, devitjobs, euremotejobs, englishjobs, jobsinenglish, devjobsde, jobsch, makeitingermany, dice, remoteineurope, workingnomads, rustjobs, nodesk
# For API-backed companies:
#   - `api:` may point directly to the search endpoint
#   - PCSX portals can also be configured with `provider: pcsx` + `api_domain:`
#   - Landing.jobs can be configured with `provider: landingjobs` +
#     `api: https://landing.jobs/feed` and optional client-side `api_params:`
#     such as `q`, `category`, `remote_policy`, `country`, `city`, `job_type`,
#     `published_within_days`, and `updated_within_days`
#   - SwissDevJobs / GermanTechJobs / DevITJobs.* can be configured with
#     `provider: swissdevjobs`, `germantechjobs`, or `devitjobs` plus a
#     domain-specific `api: https://<portal>/api/jobsLight`. These public JSON
#     endpoints are the optimal low-friction source: they already expose title,
#     company, city, workplace, salary band, language, visa sponsorship, job
#     type, experience, and tech tags. Optional local `api_params:` include
#     `q`, `city`, `city_category`, `workplace`, `language`,
#     `visa_sponsorship`, `job_type`, `exp_level`, `tech_category`,
#     `meta_category`, `company_type`, `company_size`, `technologies`, and
#     `published_within_days`
#   - ITJobs can be configured with `provider: itjobs` + `api_params:` using
#     listing-page filters (`date`, `work_model`, `location`, `salary`, `type`,
#     `contract`) and optional `api_max_pages:`
#   - EU Remote Jobs can be configured with `provider: euremotejobs` +
#     `api:` pointing to `https://euremotejobs.com/job-listings/feed/` or a
#     category feed such as `https://euremotejobs.com/job-category/engineering/feed/`,
#     plus optional `api_max_pages:` for `?paged=N` RSS pagination
#   - SAPO Emprego can be configured with `provider: sapo` + `api_params:` using
#     search/listing filters such as `pesquisa`, `categoria`, `modelo`,
#     `distrito`, and optional `api_max_pages:`
#   - Portal Emprego can be configured with `provider: portalemprego` +
#     `api_params.pesquisa:` using keyword-seeded SEO listing pages and optional
#     `api_max_pages:`
#   - The EnglishJobs / EnglishJobSearch country portals can be configured with
#     `provider: englishjobs` + a country `careers_url`, for example:
#     `https://englishjobsearch.ch`, `https://englishjobs.dk`,
#     `https://englishjobsearch.se`, `https://englishjobs.no`,
#     `https://englishjobs.fi`, `https://englishjobsearch.nl`, or
#     `https://englishjobs.de`. Optional `api_params:` use `q`, `location`, and
#     `include`. All observed country portals publish the same stable search
#     contract in `llms.txt`, support `?format=markdown`, and paginate with
#     `?page=N`, so the optimal integration is markdown SERP parsing rather than
#     brittle HTML scraping. Result links are tracker clickouts, not canonical
#     downstream job URLs, so dedup should key off the stable `/clickout/{id}`
#     path and keep the full clickout URL for evaluation.
#   - JobsInEnglish.dk can be configured with `provider: jobsinenglish` +
#     `careers_url: https://jobsinenglish.dk/`. Optional `api_params:` use
#     `q`/`search`, repeated `region`, and repeated `category`. The best scan
#     surface is the first-party HTMX `/view_all_ads/` endpoint, which returns
#     one unpaginated HTML fragment per filtered query when requested with
#     `HX-Request: true`; canonical `/ads/...` pages retain full descriptions,
#     JobPosting schema, and the outbound Apply Now link.
#   - jobs.ch can be configured with `provider: jobsch` + a localized
#     search URL such as `https://www.jobs.ch/en/vacancies/`,
#     `https://www.jobs.ch/de/stellenangebote/`, or
#     `https://www.jobs.ch/fr/offres-emplois/`. Optional `api_params.term:` can
#     seed multiple queries and the scanner paginates with `?page=N`. The public
#     `job-search-api.jobs.ch` host appears WAF-protected for direct scraping,
#     but the HTML search page embeds `__INIT__.vacancy.results.main.results`
#     plus localized `__GLOBAL__.ROUTES.VACANCY_DETAIL`, making embedded JSON
#     extraction the lowest-friction stable integration.
#   - Dice can be configured with `provider: dice` + `api:` pointing to
#     `https://www.dice.com/jobs` and `api_params:` using public search params
#     such as `q`, `location`, `includeRemote`, `filters.workplaceTypes`,
#     `employmentType`, `postedDate`, and `employerType`, plus optional
#     `api_page_size:` / `api_max_pages:`
#   - Remote in Europe can be configured with `provider: remoteineurope` +
#     a category URL such as `https://remoteineurope.com/categories/programming`
#     or optional `api_params.category:` slugs like `programming`, `product`,
#     and `devops-sysadmin`. The scanner paginates Webflow category listings,
#     then enriches each job detail page to recover the external apply URL,
#     company site, publish/expiry dates, and full description.
#   - Working Nomads can be configured with `provider: workingnomads` +
#     `api: https://www.workingnomads.com/api/exposed_jobs/` and optional
#     client-side `api_params:` such as `location`, `category`, `q`, `tags`,
#     and `published_within_days`. Public server-side filters/pagination were
#     not observed, so the scanner fetches once and filters locally.
#   - RustJobs.dev can be configured with `provider: rustjobs` +
#     `careers_url: https://rustjobs.dev`. Optional `api_params.location:`
#     values include slugs like `remote`, `europe`, `united-states`,
#     `united-kingdom`, `germany`, and `netherlands`. Direct HTTP fetches are
#     rate-limited, so the scanner uses Playwright to render the first-party
#     location pages, click `Load more jobs`, and extract canonical job URLs,
#     company, location, salary, remote policy, posted date, and apply URL
#     from the DOM.
#   - NoDesk can be configured with `provider: nodesk` +
#     `careers_url: https://nodesk.co/remote-jobs/`. The optimal integration is
#     the public Algolia index used by the site search, with `Origin`/`Referer`
#     headers matching nodesk.co. Optional `api_params.search_filter:` values use
#     NoDesk path slugs such as `remote-jobs`, `remote-jobs/engineering`,
#     `remote-jobs/product`, or `remote-jobs/europe`, plus optional `api_params.q:`
#     to seed title/keyword queries. Detail pages expose the real outbound apply
#     URL and JobPosting schema, so the scanner enriches hits with those fields.
# Search-only portals such as Indeed belong in `search_queries`, not
# `tracked_companies`, unless you have a proven low-friction HTML/API path.
#
# Provider routing (scan.mjs):
#   By default each entry is auto-detected from `careers_url` against the
#   loaded providers in providers/*.mjs. local-parser runs before API/provider
#   detection when parser.command + parser.script are set.
#
#   Optional fields on a tracked_companies entry:
#     provider: <id>     — force a specific provider, skipping detect().
#     transport: http    — reserved for future transports. Defaults to http.
#
# For SSR/static career pages, add parser.command + parser.script. The command
# can be python3, node, or another local executable. The script must print JSON
# jobs to stdout: [{ "title": "...", "url": "...", "location": "..." }]
#
# Generic local parser examples. Most parser scripts are company-specific and
# already know their target careers URL. `args` are optional and can help the
# parser author (reuse across companies, debug flags, JSON snapshots, etc.).
#
# JavaScript parser:
# - name: Example JS Company
#   careers_url: https://example.com/careers
#   scan_method: local_parser
#   parser:
#     command: node
#     script: scripts/parsers/example-js-company-jobs.js
#     format: jobs-json-v1
#   enabled: true
#
# Python parser:
# - name: Example Python Company
#   careers_url: https://example.org/jobs
#   scan_method: local_parser
#   parser:
#     command: python3
#     script: scripts/parsers/example_python_company_jobs.py
#     format: jobs-json-v1
#   enabled: true

# ── Provider auto-detection ───────────────────────────────────────
# scan.mjs auto-loads everything in providers/*.mjs and tries each
# provider's detect() in order. URL patterns recognized:
#
#   greenhouse      job-boards(.eu)?.greenhouse.io/<slug>  (or api: field)
#   ashby           jobs.ashbyhq.com/<slug>
#   lever           jobs.lever.co/<slug>
#   workable        apply.workable.com/<slug>
#   smartrecruiters (careers|jobs).smartrecruiters.com/<slug>
#   recruitee       <slug>.recruitee.com
#   bamboohr        <tenant>.bamboohr.com               (or api: field)
#   breezy          <tenant>.breezy.hr                  (or api: field)
#   solidjobs       solid.jobs/public-api/offers/<division>
#   comeet          api: https://www.comeet.co/careers-api/2.0/company/<uid>/positions?token=<token>
#   personio        <slug>.jobs.personio.(de|com)
#   pinpoint        <slug>.pinpointhq.com
#   rippling        ats.rippling.com/<slug>/jobs
#
# When the public careers URL is a branded custom domain (e.g.
# careers.adyen.com), set `provider: smartrecruiters` explicitly to
# bypass detect(). The `provider:` field wins over auto-detection.
#
# Some providers are job boards / aggregators with no per-company careers
# URL to detect, so they must be selected with an explicit `provider:`
# field: 4dayweek, arbeitnow, arbeitsagentur, glints, himalayas, ibm, jobicy,
# jobstreet, justjoin, landingjobs, nofluffjobs, remoteok, remotive, thehub,
# weworkremotely, workingnomads. Examples for every built-in provider are below.

# ── Built-in provider examples ────────────────────────────────────
# Commented config for each provider in providers/. Copy a stanza into
# tracked_companies, uncomment, and adjust. Auto-detected providers only
# need careers_url; the rest need provider: plus any fields shown.
#
# -- Auto-detected company ATS (careers_url is enough) --
#
# - name: Example BambooHR Co
#   careers_url: https://exampleco.bamboohr.com/careers   # any *.bamboohr.com host
#   enabled: true
#
# - name: Example Breezy Co
#   careers_url: https://exampleco.breezy.hr              # any *.breezy.hr host
#   enabled: true
#
# - name: Example Pinpoint Co
#   careers_url: https://exampleco.pinpointhq.com         # any *.pinpointhq.com host
#   enabled: true
#
# - name: Example Rippling Co
#   careers_url: https://ats.rippling.com/exampleco/jobs  # any ats.rippling.com/<slug>
#   enabled: true
#
# - name: SolidJobs — Engineering
#   # division path is required; one of:
#   # it, engineering, marketing, sales, hr, logistics, finances, other
#   careers_url: https://solid.jobs/public-api/offers/engineering
#   enabled: true
#
# -- Job boards / aggregators (no careers_url; set provider: explicitly) --
#
# - name: 4 Day Week                      # 4-day-week / reduced-hours roles
#   provider: 4dayweek
