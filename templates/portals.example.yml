#   enabled: true
#
# - name: Arbeitsagentur — AI Roles      # German federal jobs API
#   provider: arbeitsagentur
#   arbeitsagentur:
#     keywords: ["AI Engineer", "Machine Learning"]  # required (>=1)
#     wo: Berlin          # optional anchor city ('' / omit = all of Germany)
#     umkreis: 50         # optional km radius around wo (0-1000)
#     days: 30            # optional recency window (1-1000)
#     size: 100           # optional results per keyword (1-100)
#   enabled: true
#
# - name: Glints — Indonesia             # SE-Asia aggregator (SG/ID/MY/VN)
#   provider: glints
#   searchKeywords: "AI Engineer"
#   countryCode: ID       # optional 2-letter code (default ID)
#   enabled: true
#
# - name: Jobstreet — Indonesia          # SEEK aggregator
#   provider: jobstreet
#   searchKeywords: "Software Engineer"
#   siteKey: ID-Main      # optional SEEK site key (default ID-Main)
#   searchLocation: ""    # optional location filter
#   enabled: true
#
# - name: IBM — Germany SWE              # IBM global careers
#   provider: ibm
#   ibm:
#     country: Germany                      # optional facet filter
#     categories: ["Software Engineering"]  # optional facet filter
#   enabled: true
#
# -- Remote-job feeds (no careers_url, no extra fields) --
# title_filter / location_filter defined above still apply.
#
# - name: Himalayas
#   provider: himalayas
# - name: Landing.jobs                    # tech board, Europe-focused
#   provider: landingjobs
#   enabled: true
#
# - name: RemoteOK
#   provider: remoteok
#   enabled: true
#
# - name: Remotive
#   provider: remotive
#   enabled: true
#
# - name: NoDesk
#   provider: nodesk
#   enabled: true
#
# - name: We Work Remotely
#   provider: weworkremotely
#   enabled: true
#
# - name: Working Nomads
#   provider: workingnomads
#   enabled: true
#
# - name: Jobicy
#   provider: jobicy
#   enabled: true
#
# Comeet needs the full careers-api URL (it carries a per-tenant token that a
# branded careers page does not expose), so set it via the api: field — e.g.:
#
#   - name: Spark Hire
#     careers_url: https://www.comeet.com/jobs/spark-hire/30.005
#     api: https://www.comeet.co/careers-api/2.0/company/30.005/positions?token=YOUR_TOKEN
#     enabled: true
#
# Find <uid> and <token> in Comeet under Settings → Sourcing → Careers Website →
# Integrated website → Careers API.
#
# Personio (common across DACH/EU) auto-detects from its careers host and
# pulls the public no-auth XML feed at <slug>.jobs.personio.de/xml — e.g.:
#
#   - name: Example GmbH
#     careers_url: https://example-gmbh.jobs.personio.de
#     enabled: true

tracked_companies:

  # -- AI Labs & LLM providers --

  - name: Anthropic
    careers_url: https://job-boards.greenhouse.io/anthropic
    api: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    enabled: true

  - name: OpenAI
    careers_url: https://openai.com/careers
    scan_method: websearch
    scan_query: 'site:openai.com/careers "Solutions" OR "Forward Deployed" OR "AI Engineer"'
    enabled: true

  - name: ITJobs Portugal
    careers_url: https://www.itjobs.pt/emprego/remote
    provider: itjobs
    api: https://www.itjobs.pt/emprego
    api_params:
      date: 24h
      work_model:
        - 1
        - 2
    api_max_pages: 3
    notes: "Server-rendered Portugal IT job board with stable filters for date, work model, location, salary, contract, and pagination."
    enabled: false

  - name: SAPO Emprego
    careers_url: https://emprego.sapo.pt/offers
    provider: sapo
    api: https://emprego.sapo.pt/offers
    api_params:
      pesquisa:
        - ai
        - "machine learning"
        - "data science"
      categoria: informatica-tecnologias
      modelo:
        - teletrabalho,hibrido
        - hibrido
    api_max_pages: 4
    notes: "Server-rendered Portugal job board with embedded results payloads, native tech/remote filters, and JobPosting JSON-LD on detail pages."
    enabled: false

  - name: Portal Emprego
    careers_url: https://www.portalemprego.pt/anuncios/
    provider: portalemprego
    api: https://www.portalemprego.pt/anuncios/
    api_params:
      pesquisa:
        - ai
        - engenheiro
        - automation
      mostrar: 20
    api_max_pages: 4
    notes: "Server-rendered Portugal job board with keyword-seeded SEO listing pages and stable pagination under /anuncios/."
    enabled: false

  - name: Landing.jobs
    careers_url: https://landing.jobs/jobs
    provider: landingjobs
    api: https://landing.jobs/feed
    # Optional client-side filters on feed entries:
    # api_params:
    #   q:
    #     - ai
    #     - platform
    #   remote_policy:
    #     - Full remote
    #     - Global remote
    #     - Partial remote
    #   category:
    #     - Data
    #     - AI
    #   published_within_days: 30
    notes: "Public Atom feed with stable zero-token metadata for title, company, location, remote policy, category, salary, and publish/update dates. Search pages exist, but the feed is the most reliable integration surface."
    enabled: false

  - name: SwissDevJobs
    careers_url: https://swissdevjobs.ch/
    provider: swissdevjobs
    api: https://swissdevjobs.ch/api/jobsLight
    api_params:
      published_within_days: 45
    notes: "Public jobsLight JSON catalog with company, title, city, workplace, salary, language, visa sponsorship, job type, experience level, and tech tags. Detail pages expose a richer embedded payload too, but jobsLight is the optimal scan surface."
    enabled: false

  - name: GermanTechJobs
    careers_url: https://germantechjobs.de/
    provider: germantechjobs
    api: https://germantechjobs.de/api/jobsLight
    api_params:
      published_within_days: 45
    notes: "Same jobsLight portal family as SwissDevJobs, localized for Germany. Best integration surface is the public JSON catalog rather than RSS or per-job page scraping."
    enabled: false

  - name: DevITJobs UK
    careers_url: https://devitjobs.uk/
    provider: devitjobs
    api: https://devitjobs.uk/api/jobsLight
    api_params:
      published_within_days: 45
    notes: "Same jobsLight portal family as SwissDevJobs, localized for the UK market. Public JSON catalog already includes salary bands, visa flag, workplace mode, and tech tags."
    enabled: false

  - name: DevITJobs NL
    careers_url: https://devitjobs.nl/
    provider: devitjobs
    api: https://devitjobs.nl/api/jobsLight
    api_params:
      published_within_days: 45
    notes: "Same jobsLight portal family as SwissDevJobs, localized for the Netherlands. Public JSON catalog is the lowest-friction scan surface."
    enabled: false

  - name: EU Remote Jobs
    careers_url: https://euremotejobs.com/job-category/engineering/
    provider: euremotejobs
    api: https://euremotejobs.com/job-listings/feed/
    api_max_pages: 4
    notes: "WordPress RSS feed with paginated `?paged=N` archives, canonical job URLs, publish dates, and normalized summaries. Better fit than HTML scraping or WebSearch for zero-token scanning."
    enabled: false

  - name: English Job Search Switzerland
    careers_url: https://englishjobsearch.ch
    provider: englishjobs
    api_params:
      q:
        - "platform engineer"
        - "backend engineer"
        - "software engineer"
      location:
        - zurich
        - geneve
      include:
        - german
    api_max_pages: 3
    notes: "English-speaking Switzerland aggregator with documented search URLs in llms.txt, markdown rendering via `format=markdown`, and simple `page` pagination. Best used as a discovery source with seeded query/location combinations; outbound links remain portal clickouts."
    enabled: false

  - name: Jobs.ch Switzerland
    careers_url: https://www.jobs.ch/en/vacancies/
    provider: jobsch
    api_params:
      term:
        - "platform engineer"
        - "backend engineer"
        - "software engineer"
    api_max_pages: 3
    notes: "Public jobs.ch search pages embed structured `__INIT__.vacancy.results` data and localized detail routes, so HTML fetch + JSON extraction is more reliable than the WAF-protected search API host."
    enabled: false

  - name: English Jobs Denmark
    careers_url: https://englishjobs.dk
    provider: englishjobs
    api_params:
      q:
        - "platform engineer"
        - "backend engineer"
        - "software engineer"
      location:
        - kobenhavn
        - arhus
      include:
        - danish
    api_max_pages: 3
    notes: "English-speaking Denmark aggregator in the same portal family as englishjobsearch.ch, with the same llms.txt search contract, markdown rendering, and `page` pagination. Use as a seeded discovery source; outbound links remain portal clickouts."
    enabled: false

