    enabled: false

  - name: Dice
    careers_url: https://www.dice.com/jobs
    provider: dice
    api: https://www.dice.com/jobs
    api_params:
      q:
        - 'artificial intelligence'
        - 'machine learning'
        - 'solutions architect'
        - 'platform engineer'
      includeRemote: true
      # Optional public filters seen in Dice search state:
      # filters.workplaceTypes:
      #   - Remote
      #   - Hybrid
      # employmentType:
      #   - FULLTIME
      #   - CONTRACTS
      # postedDate:
      #   - ONE
      #   - THREE
      #   - SEVEN
      # employerType:
      #   - Direct Hire
      #   - Recruiter
    api_page_size: 20
    api_max_pages: 4
    notes: "SSR search pages embed structured job results with canonical job-detail URLs, company, title, location, employment type, salary, workplace type, easy-apply flag, and pageCount. Best used with a small set of seeded queries rather than broad unfiltered crawling."
    enabled: false

  - name: Remote in Europe
    careers_url: https://remoteineurope.com/categories/programming
