        - "platform engineer"
        - "backend engineer"
        - "software engineer"
      category:
        - software-development
        - engineering
        - data-science
    notes: "Denmark-focused English-speaking aggregator. The optimal integration surface is the first-party HTMX `/view_all_ads/` endpoint with server-side `search`, repeated `region`, and repeated `category` filters; canonical `/ads/...` pages keep the full description, JobPosting schema, and external Apply Now link."
